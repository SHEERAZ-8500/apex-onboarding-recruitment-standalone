<form class="edit-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <header class="edit-card__head">
    <span class="edit-card__eyebrow">Step 2 of 2</span>
    <h3>Complete your details</h3>
    <p>This information helps complete your profile.</p>
  </header>

  <div class="field">
    <label for="phoneNumber">Phone number</label>
    <input
      id="phoneNumber"
      type="tel"
      formControlName="phoneNumber"
      placeholder="03001234567"
      autocomplete="tel"
    />
    <p class="hint" *ngIf="phoneNumber?.invalid && phoneNumber?.touched">
      Sahi mobile number likhein, e.g. 03001234567.
    </p>
  </div>

  <div class="field">
    <label for="address">Address</label>
    <textarea
      id="address"
      formControlName="address"
      rows="3"
      placeholder="House / Street, Area, City"
    ></textarea>
    <p class="hint" *ngIf="address?.invalid && address?.touched">
      Address 255 characters se zyada nahi ho sakta.
    </p>
  </div>

  <div class="field">
    <label for="cnic">CNIC</label>
    <input
      id="cnic"
      type="text"
      formControlName="cnic"
      placeholder="42101-1234567-1"
      maxlength="15"
      inputmode="numeric"
      (input)="onCnicInput($event)"
    />
    <p class="hint" *ngIf="cnic?.invalid && cnic?.touched">
      Format yeh hona chahiye: 42101-1234567-1
    </p>
  </div>

  <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <div class="edit-card__actions">
    <button type="button" class="btn btn--ghost" (click)="cancel()" [disabled]="saving">
      Cancel
    </button>
    <button type="submit" class="btn btn--primary" [disabled]="saving">
      <span *ngIf="!saving">Save changes</span>
      <span *ngIf="saving">Saving…</span>
    </button>
  </div>
</form>
