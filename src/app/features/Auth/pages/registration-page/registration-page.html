<div class="auth-screen">

  <!-- LEFT — Hero (full image, never cropped) -->
  <section class="auth-hero" aria-hidden="true">
    <img
      class="auth-hero__image"
      src="assets/burj-khalifa.jpg.jpeg"
      alt=""
    />
    <div class="auth-hero__overlay"></div>
    <div class="auth-hero__content">
      <span class="auth-hero__eyebrow">A New Icon A New Standard</span>
      <h2 class="auth-hero__title">Own a piece<br>of the  <span style="color: var(--gold);">Burj Quaid</span></h2>
      <p class="auth-hero__caption">Premium addresses, curated for investors who see further.</p>
    </div>
  </section>

  <!-- RIGHT — Registration panel -->
  <section class="auth-panel">
    <div class="auth-panel__inner">

      <!-- Heading — OUTSIDE the card now -->
      <header class="auth-heading">
        <p class="auth-heading__welcome">Welcome</p>
        <h1>Register Yourself</h1>
      </header>

      <!-- Breadcrumb steps — heading ke neeche, card se pehle -->
    <nav class="steps" aria-label="Registration steps">

  <button
    type="button"
    class="steps__item"
    [class.is-active]="currentStep === 1"
    [class.is-done]="currentStep > 1"
    (click)="goToStep(1)"
  >
    <span class="steps__index">1</span>
    <span class="steps__label">Account</span>
  </button>

  <span class="steps__divider" [class.is-filled]="currentStep > 1"></span>

  <button
    type="button"
    class="steps__item"
    [class.is-active]="currentStep === 2"
    [disabled]="maxStepReached < 2"
    (click)="goToStep(2)"
  >
    <span class="steps__index">2</span>
    <span class="steps__label">Verify Email</span>
  </button>

</nav>

      <!-- Registration Card — only the form lives here now -->
   <div class="auth-card">

  <form
    class="auth-form"
    (ngSubmit)="currentStep === 1 ? createAccount() : verifyRegistrationOtp()"
    novalidate
  >

    <!-- STEP 1 — Registration form -->
    <ng-container *ngIf="currentStep === 1">

      <div class="row g-3 mx-0">
        <div class="col-12 col-sm-6">
          <div class="field">
            <label for="firstName">First Name</label>
            <input
              id="firstName"
              name="firstName"
              type="text"
              class="form-control"
              placeholder="Amna"
              autocomplete="given-name"
              [(ngModel)]="model.firstName"
              [disabled]="isSubmitting"
              required
            />
          </div>
        </div>

        <div class="col-12 col-sm-6">
          <div class="field">
            <label for="lastName">Last Name</label>
            <input
              id="lastName"
              name="lastName"
              type="text"
              class="form-control"
              placeholder="Qayyum"
              autocomplete="family-name"
              [(ngModel)]="model.lastName"
              [disabled]="isSubmitting"
              required
            />
          </div>
        </div>
      </div>

      <div class="row g-3 mx-0">
        <div class="col-12">
          <div class="field">
            <label for="email">Email Address</label>
            <input
              id="email"
              name="email"
              type="email"
              class="form-control"
              placeholder="you@example.com"
              autocomplete="email"
              [(ngModel)]="model.email"
              [disabled]="isSubmitting"
              required
            />
          </div>
        </div>
      </div>

      <div class="row g-3 mx-0">
        <div class="col-12">
          <div class="field">
            <label for="password">Password</label>

            <div class="field__control">
              <input
                id="password"
                name="password"
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                placeholder="Minimum 8 characters"
                autocomplete="new-password"
                [(ngModel)]="model.password"
                [disabled]="isSubmitting"
                required
              />

              <button
                type="button"
                class="field__toggle"
                (click)="togglePassword()"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              >
                <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"
                    stroke="currentColor"
                    stroke-width="1.6"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                    stroke="currentColor"
                    stroke-width="1.6"
                  />
                </svg>

                <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.6 6.7C3.9 8.3 1.5 12 1.5 12S5 19 12 19c1.8 0 3.3-.4 4.6-1.1M9.9 5.1A11 11 0 0 1 12 5c7 0 10.5 7 10.5 7-.4.7-1.2 1.9-2.4 3.1"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="auth-form__actions auth-form__actions--end">
        <button
          type="submit"
          class="btn btn--primary"
          [disabled]="isSubmitting"
        >
          <span *ngIf="!isSubmitting">Create Account</span>
          <span
            *ngIf="isSubmitting"
            class="btn__spinner"
            aria-label="Creating account"
          ></span>
        </button>
      </div>

    </ng-container>

    <!-- STEP 2 — OTP verification inside registration page -->
    <ng-container *ngIf="currentStep === 2">

      <div class="registration-otp">
        <div class="registration-otp__header">
          <h3>Verify Your Email</h3>
          <p>
            We sent a 6-digit verification code to
            <strong>{{ model.email }}</strong>
          </p>
        </div>

        <div class="registration-otp__input">
          <ng-otp-input
            (onInputChange)="onOtpChange($event)"
            [config]="otpConfig"
          ></ng-otp-input>
        </div>
      </div>

      <div class="auth-form__actions">
        <button
          type="button"
          class="btn btn--ghost"
          (click)="goBack()"
          [disabled]="isVerifyingOtp"
        >
          Back
        </button>

        <button
          type="submit"
          class="btn btn--primary"
          [disabled]="isVerifyingOtp"
        >
          <span *ngIf="!isVerifyingOtp">Verify & Continue</span>
          <span
            *ngIf="isVerifyingOtp"
            class="btn__spinner"
            aria-label="Verifying OTP"
          ></span>
        </button>
      </div>

      <p class="registration-otp__resend">
        Didn't receive the code?

        <button
          type="button"
          class="registration-otp__resend-btn"
          (click)="resendRegistrationOtp()"
          [disabled]="isResendingOtp || isVerifyingOtp"
        >
          {{ isResendingOtp ? 'Sending...' : 'Resend OTP' }}
        </button>
      </p>

    </ng-container>

  </form>

</div>
      <!-- /Registration Card -->

      <!-- Feature strip — outside card -->
      <ul class="features">
        <li class="features__item" *ngFor="let f of features">
          <span class="features__icon">
            <svg *ngIf="f.icon === 'building'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="5" y="3" width="14" height="18" rx="1" stroke="currentColor" stroke-width="1.4"/>
              <path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M10 21v-3h4v3" stroke="currentColor" stroke-width="1.4"/>
            </svg>
            <svg *ngIf="f.icon === 'shield'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3l7 3v5c0 5-3.2 8-7 10-3.8-2-7-5-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.4"/>
              <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg *ngIf="f.icon === 'chart'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 20V10M9.5 20V6M15 20v-7M20.5 20V4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <svg *ngIf="f.icon === 'headset'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 13v-1a8 8 0 1 1 16 0v1" stroke="currentColor" stroke-width="1.4"/>
              <rect x="3" y="13" width="4" height="6" rx="1.4" stroke="currentColor" stroke-width="1.4"/>
              <rect x="17" y="13" width="4" height="6" rx="1.4" stroke="currentColor" stroke-width="1.4"/>
              <path d="M19 19.5c0 1.4-1.6 2.5-4 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="features__text">
            <strong>{{ f.title }}</strong>
            <small>{{ f.subtitle }}</small>
          </span>
        </li>
      </ul>

    </div>
  </section>
</div>
