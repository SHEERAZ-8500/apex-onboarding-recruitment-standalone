<div class="auth-screen">

  <!-- Full-bleed background — entire landscape image, always visible, never split/cropped -->
  <img
    class="auth-screen__bg"
    src="assets/claude.jpg"
    alt=""
  />
  <div class="auth-screen__overlay" aria-hidden="true"></div>

  <!-- Right-side floating content -->
  <div class="auth-content">

    <!-- Logo — no background -->
    <!-- <div class="brand">
      <span class="brand__spire" aria-hidden="true"></span>
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L13.2 7.4L16 4L14.6 8.8L19 6.5L15.6 10.2L21 9.6L15.9 12.5L20.5 15L15.3 14.6L18.7 18.4L14.2 16.3L15.4 21L12 17.4L8.6 21L9.8 16.3L5.3 18.4L8.7 14.6L3.5 15L8.1 12.5L3 9.6L8.4 10.2L5 6.5L9.4 8.8L8 4L10.8 7.4L12 2Z" fill="currentColor"/>
          <rect x="10.8" y="17" width="2.4" height="5.5" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand__name">SKYLINE&nbsp;<em>ESTATES</em></span>
    </div> -->

    <!-- Login Card — transparent / glass, like reference -->
    <div class="auth-card">

      <header class="auth-heading">
        <h1>Welcome</h1>
        <!-- <p class="auth-heading__welcome"></p> -->
      </header>

      <form class="auth-form" (ngSubmit)="onSubmit()" novalidate>

        <div class="field">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            [(ngModel)]="email"
            required
          />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="field__control">
            <input
              id="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="••••••••••"
              autocomplete="current-password"
              [(ngModel)]="password"
              required
            />
            <button
              type="button"
              class="field__toggle"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.6 6.7C3.9 8.3 1.5 12 1.5 12S5 19 12 19c1.8 0 3.3-.4 4.6-1.1M9.9 5.1A11 11 0 0 1 12 5c7 0 10.5 7 10.5 7-.4.7-1.2 1.9-2.4 3.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-form__row">
          <label class="checkbox">
            <input type="checkbox" name="remember" [(ngModel)]="rememberMe" />
            <span class="checkbox__box"></span>
            Remember me
          </label>
          <a href="#" class="link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn--primary" [disabled]="isSubmitting">
          <span *ngIf="!isSubmitting">Log in</span>
          <span *ngIf="isSubmitting" class="btn__spinner" aria-label="Signing in"></span>
        </button>

        <div class="divider"><span>or</span></div>

        <button type="button" class="btn btn--google" (click)="continueWithGoogle()">
          <svg viewBox="0 0 18 18" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.61Z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.55-1.84.87-3.06.87-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A8.997 8.997 0 0 0 9 18Z"/>
            <path fill="#FBBC05" d="M3.95 10.71a5.4 5.4 0 0 1 0-3.42V4.96H.95a9 9 0 0 0 0 8.08l3-2.33Z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A8.59 8.59 0 0 0 9 0 8.997 8.997 0 0 0 .95 4.96l3 2.33C4.66 5.17 6.65 3.58 9 3.58Z"/>
          </svg>
          Continue with Google
        </button>

        <p class="auth-form__signup">
          New Here? <a href="#" class="link">Create an account</a>
        </p>
      </form>

    </div>
    <!-- /Login Card -->

    <!-- Feature strip -->
    <ul class="features">
      <li class="features__item" *ngFor="let f of features">
        <span class="features__icon">
          <svg *ngIf="f.icon === 'building'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="5" y="3" width="14" height="18" rx="1" stroke="currentColor" stroke-width="1.4"/>
            <path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M10 21v-3h4v3" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <svg *ngIf="f.icon === 'shield'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3l7 3v5c0 5-3.2 8-7 10-3.8-2-7-5-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.4"/>
            <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg *ngIf="f.icon === 'chart'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 20V10M9.5 20V6M15 20v-7M20.5 20V4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <svg *ngIf="f.icon === 'headset'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 13v-1a8 8 0 1 1 16 0v1" stroke="currentColor" stroke-width="1.4"/>
            <rect x="3" y="13" width="4" height="6" rx="1.4" stroke="currentColor" stroke-width="1.4"/>
            <rect x="17" y="13" width="4" height="6" rx="1.4" stroke="currentColor" stroke-width="1.4"/>
            <path d="M19 19.5c0 1.4-1.6 2.5-4 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="features__text">
          <strong>{{ f.title }}</strong>
          <small>{{ f.subtitle }}</small>
        </span>
      </li>
    </ul>

  </div>
  <!-- /auth-content -->

</div>
