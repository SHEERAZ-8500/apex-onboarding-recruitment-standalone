<header class="header py-3">
  <div class="d-flex gap-2">
    <button (click)="toggleSidebar()" class="menu-btn">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="search-box">
      <input type="text" placeholder="Search" />
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>
  </div>
  <div class="button-group">

    <!-- <button class="display-none-style" (click)="openChat()">
      <i class="fa-solid fa-comment-dots"></i>
    </button> -->
    <!-- <button><i class="fa-solid fa-earth-americas"></i></button> -->

    <div class="notif-wrap">
      <button class="bell-btn" (click)="toggleNotifications()">
        <i class="fa-solid fa-bell"></i>
        <span class="wave"></span>
        <span class="bell-badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
      </button>

      <div
        class="notify-card"
        #notifyCard
        *ngIf="showNotifications"
        [class.bounce]="animateBounce"
      >
        <div class="notify-header d-flex justify-content-between align-items-center">
          <h6 class="mb-0">Notifications</h6>
          <button class="clear-all-btn" (click)="onClearAll()" *ngIf="recentNotifications.length">
            Clear All
          </button>
        </div>

        <div class="notify-loading" *ngIf="loadingRecent">
          <span class="mini-spinner"></span>
        </div>

        <ng-container *ngIf="!loadingRecent">
          <div class="notify-empty" *ngIf="!recentNotifications.length">
            <i class="fa-regular fa-bell-slash"></i>
            <span>No new notification found.</span>
          </div>

          <div
            class="notify-item"
            *ngFor="let item of recentNotifications"
            [class.unread]="!item.isRead"
            (click)="onNotificationClick(item)"
          >
            <i [class]="getIconClass(item.type)"></i>
            <div class="notify-item__body">
              <span class="notify-item__title">{{ item.title }}</span>
              <span class="notify-item__text">{{ item.body }}</span>
              <small>{{ getRelativeTime(item.createdDate) }}</small>
            </div>
            <span class="dot" *ngIf="!item.isRead"></span>
          </div>
        </ng-container>

        <button class="view-all" (click)="goToAllNotifications()">View All</button>
      </div>
    </div>

    <div class="btn-group display-none-style" ngbDropdown>
      <button class="dropdown-btn" id="dropdownBasic" ngbDropdownToggle>
        <i class="fa-solid fa-gear"></i>
      </button>
      <ul id="dropdown-basic" ngbDropdownMenu class="dropdown-menu" role="menu" aria-labelledby="button-basic">
        <li role="menuitem"><a class="dropdown-item" (click)="logoutUser()">Log-Out</a></li>
      </ul>
    </div>
  </div>
</header>
